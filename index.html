<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Análise Modal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#eee;font-family:system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
h1{font-size:18px;margin:12px 0 8px}
.btns{display:flex;gap:8px;margin-bottom:8px}
button,select{flex:1;padding:14px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-size:16px}
button.main{background:#0a84ff;border-color:#0a84ff;font-weight:600}
button.rec{background:#c62828;border-color:#c62828}
.card{background:#0d0d0d;border:1px solid #222;border-radius:12px;padding:8px;margin-bottom:8px}
.card h2{font-size:13px;margin:0 0 4px;color:#999;font-weight:500}
canvas{width:100%;height:170px;display:block}
.read{display:flex;gap:6px}
.read div{flex:1;background:#0d0d0d;border:1px solid #222;border-radius:10px;padding:8px;text-align:center}
.read b{display:block;font-size:20px}
.read small{color:#888}
#st{font-size:12px;color:#888;margin:4px 0 10px}
</style></head><body>
<h1>Análise Modal – Acelerômetro + FFT</h1>
<div class="btns">
<button id="go" class="main">Iniciar</button>
<button id="pp" disabled>Pausar</button>
<button id="clr">Limpar</button>
</div>
<div class="btns">
<select id="src"><option value="lin">Sem gravidade</option><option value="g">Com gravidade</option></select>
<select id="fmax"><option value="10">0–10 Hz</option><option value="25" selected>0–25 Hz</option><option value="50">0–50 Hz</option><option value="0">Nyquist</option></select>
</div>
<div class="read">
<div style="color:#ff5252"><small>X</small><b id="fx">–</b><small id="ax"></small></div>
<div style="color:#69f0ae"><small>Y</small><b id="fy">–</b><small id="ay"></small></div>
<div style="color:#40c4ff"><small>Z</small><b id="fz">–</b><small id="az"></small></div>
</div>
<div id="st">Pronto. Fs: –</div>
<div class="card"><h2>Aceleração (m/s²) × tempo — últimos 5 s</h2><canvas id="c1"></canvas></div>
<div class="card"><h2>Espectro FFT (amplitude) × frequência (Hz)</h2><canvas id="c2"></canvas></div>
<script>
const COL=['#ff5252','#69f0ae','#40c4ff'],MAXN=4096,NFFT=1024;
let T=[],D=[[],[],[]],running=false,paused=true,started=false,sensor=null,spec=null,fs=0;
const $=id=>document.getElementById(id);

function push(t,x,y,z){
  if(paused)return;
  T.push(t);D[0].push(x);D[1].push(y);D[2].push(z);
  if(T.length>MAXN){T.shift();D.forEach(a=>a.shift());}
}
function onMotion(e){
  const a=$('src').value==='g'?e.accelerationIncludingGravity:(e.acceleration||e.accelerationIncludingGravity);
  if(!a||a.x==null)return;
  push(performance.now()/1000,a.x,a.y,a.z);
}
async function start(){
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){
      if(await DeviceMotionEvent.requestPermission()!=='granted'){$('st').textContent='Permissão negada.';return;}
    }
  }catch(e){}
  let ok=false;
  if('Accelerometer' in window&&'LinearAccelerationSensor' in window){
    try{
      const mk=()=>$('src').value==='g'?new Accelerometer({frequency:200}):new LinearAccelerationSensor({frequency:200});
      sensor=mk();
      sensor.addEventListener('reading',()=>push(performance.now()/1000,sensor.x,sensor.y,sensor.z));
      sensor.addEventListener('error',ev=>{
        $('st').textContent='Sensor: '+(ev.error&&ev.error.name)+' – usando modo alternativo';
        try{sensor.stop()}catch(e){}
        sensor=null;window.addEventListener('devicemotion',onMotion);
      });
      sensor.start();ok=true;
    }catch(e){sensor=null}
  }
  if(!ok)window.addEventListener('devicemotion',onMotion);
  setTimeout(()=>{if(!T.length)$('st').textContent='Sem dados dos sensores. Abra por https:// no Chrome e ative Configurações do site → Sensores de movimento.';},2500);
  started=true;paused=false;
  $('go').style.display='none';
  $('pp').disabled=false;$('pp').textContent='Pausar';$('pp').className='rec';
}
$('go').onclick=start;
$('pp').onclick=()=>{
  paused=!paused;
  $('pp').textContent=paused?'Retomar':'Pausar';
  $('pp').className=paused?'main':'rec';
};
$('clr').onclick=()=>{T=[];D=[[],[],[]];spec=null;['fx','fy','fz'].forEach(i=>$(i).textContent='–');['ax','ay','az'].forEach(i=>$(i).textContent='');};
$('src').onchange=()=>{if(started&&sensor){try{sensor.stop()}catch(e){}start()}};

// FFT radix-2
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]];}}
  for(let l=2;l<=n;l<<=1){
    const ang=-2*Math.PI/l,wr=Math.cos(ang),wi=Math.sin(ang);
    for(let i=0;i<n;i+=l){let cr=1,ci=0;
      for(let k=0;k<l/2;k++){
        const a=i+k,b=a+l/2,tr=re[b]*cr-im[b]*ci,ti=re[b]*ci+im[b]*cr;
        re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
        const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr;
      }}
  }
}
function compute(){
  const n=T.length;if(n<64)return;
  let N=1;while(N*2<=Math.min(n,NFFT))N*=2;
  const t0=T[n-N],t1=T[n-1];fs=(N-1)/(t1-t0);
  const res=[];
  for(let a=0;a<3;a++){
    const re=new Float64Array(N),im=new Float64Array(N);
    let m=0;for(let i=0;i<N;i++)m+=D[a][n-N+i];m/=N;
    for(let i=0;i<N;i++){const w=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));re[i]=(D[a][n-N+i]-m)*w;}
    fft(re,im);
    const mag=new Float64Array(N/2);
    for(let k=0;k<N/2;k++)mag[k]=2*Math.hypot(re[k],im[k])/(N*0.5);
    let p=1;for(let k=2;k<N/2;k++)if(mag[k]>mag[p])p=k;
    let d=0;if(p>1&&p<N/2-1){const y0=mag[p-1],y1=mag[p],y2=mag[p+1],den=y0-2*y1+y2;if(den)d=0.5*(y0-y2)/den;}
    res.push({mag,f:(p+d)*fs/N,amp:mag[p]});
  }
  spec={res,N,fs};
  ['x','y','z'].forEach((c,i)=>{$('f'+c).textContent=res[i].f.toFixed(2)+' Hz';$('a'+c).textContent='amp '+res[i].amp.toFixed(3);});
  $('st').textContent='Fs ≈ '+fs.toFixed(1)+' Hz · janela '+N+' amostras ('+(N/fs).toFixed(1)+' s) · resolução '+(fs/N).toFixed(3)+' Hz'+(paused?' · PAUSADO':'');
}
function setup(c){const r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==w*r){c.width=w*r;c.height=h*r;}const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.clearRect(0,0,w,h);return[g,w,h];}
function grid(g,w,h,l,ymin,ymax,xl0,xl1,nx,unit){
  g.strokeStyle='#222';g.fillStyle='#777';g.font='10px sans-serif';g.lineWidth=1;
  for(let i=0;i<=4;i++){const y=14+(h-34)*i/4;g.beginPath();g.moveTo(l,y);g.lineTo(w,y);g.stroke();g.fillText((ymax-(ymax-ymin)*i/4).toFixed(2),0,y+3);}
  for(let i=0;i<=nx;i++){const x=l+(w-l)*i/nx;g.fillText((xl0+(xl1-xl0)*i/nx).toFixed(unit),x-8,h-3);}
}
function drawTime(){
  const [g,w,h]=setup($('c1')),L=34;
  const n=T.length;let s=n;const tEnd=n?T[n-1]:0;
  while(s>0&&tEnd-T[s-1]<5)s--;
  let mn=-1,mx=1;
  for(let a=0;a<3;a++)for(let i=s;i<n;i++){mn=Math.min(mn,D[a][i]);mx=Math.max(mx,D[a][i]);}
  const pad=(mx-mn)*0.05;mn-=pad;mx+=pad;
  grid(g,w,h,L,mn,mx,-5,0,5,0);
  const py=v=>14+(h-34)*(1-(v-mn)/(mx-mn));
  for(let a=0;a<3;a++){g.strokeStyle=COL[a];g.lineWidth=1.4;g.beginPath();
    for(let i=s;i<n;i++){const x=L+(w-L)*(1-(tEnd-T[i])/5),y=py(D[a][i]);i===s?g.moveTo(x,y):g.lineTo(x,y);}
    g.stroke();}
}
function drawSpec(){
  const [g,w,h]=setup($('c2')),L=34;
  if(!spec){grid(g,w,h,L,0,1,0,25,5,0);return;}
  const nyq=spec.fs/2,fm=+$('fmax').value,F=(fm&&fm<nyq)?fm:nyq;
  const kmax=Math.min(spec.N/2-1,Math.floor(F/(spec.fs/spec.N)));
  let mx=1e-6;
  spec.res.forEach(r=>{for(let k=1;k<=kmax;k++)mx=Math.max(mx,r.mag[k]);});
  mx*=1.1;
  grid(g,w,h,L,0,mx,0,F,5,1);
  spec.res.forEach((r,a)=>{
    g.strokeStyle=COL[a];g.lineWidth=1.4;g.beginPath();
    for(let k=1;k<=kmax;k++){const x=L+(w-L)*(k*spec.fs/spec.N)/F,y=14+(h-34)*(1-r.mag[k]/mx);k===1?g.moveTo(x,y):g.lineTo(x,y);}
    g.stroke();
  });
}
setInterval(()=>{if(!paused)compute();},250);
(function loop(){drawTime();drawSpec();requestAnimationFrame(loop);})();
if(!('DeviceMotionEvent' in window))$('st').textContent='Este navegador não tem sensores de movimento.';
</script></body></html>
